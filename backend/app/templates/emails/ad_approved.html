{% extends "base.html" %}

{% block title %}Your Advertisement Is Live{% endblock %}

{% block content %}
<h2>{{ email_subject }}</h2>
<p>Hi {{ recipient_name }},</p>

<div style="background: white; padding: 18px 20px; border-left: 4px solid #059669; margin: 18px 0; border-radius: 4px;">
  {{ email_body_html | safe }}
</div>

<p style="text-align: center; margin-top: 28px;">
  <a href="{{ dashboard_url }}" class="button">View Your Ad</a>
</p>

<p style="font-size: 12px; color: #6b7280; margin-top: 24px;">
  Questions? Reply to this email and we'll help.
</p>
{% endblock %}
