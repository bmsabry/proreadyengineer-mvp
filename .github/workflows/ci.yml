name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # App modules build their async engine at import time from DATABASE_URL.
      # The regression tests are self-contained (they create their own SQLite
      # schema), so a throwaway SQLite URL is enough to import the app cleanly.
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install aiosqlite          # test-only driver

      - name: Run NDA dispatch regression tests
        # These guard the root-cause fix: an NDA-required RFQ must always
        # dispatch (never get stranded in awaiting_customer_signature).
        run: python -m pytest tests/unit/test_nda_dispatch.py -v
