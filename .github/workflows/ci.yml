name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # App modules build their async engine at import time from DATABASE_URL.
      # The regression tests are self-contained (they create their own SQLite
      # schema), so a throwaway SQLite URL is enough to import the app cleanly.
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install aiosqlite freezegun pyyaml   # test-only deps

      - name: Run backend unit tests
        # Green suite = the regression + smoke tests that target the CURRENT API.
        # Drifted legacy suites are quarantined (skipped) and tracked for rewrite
        # in CODE_AUDIT_2026-05-28.md. A red run here means a real regression.
        run: python -m pytest tests/unit -q

      - name: Run AI assistant golden evals
        # Deterministic guardrail checks for the help assistant (link/action allowlists,
        # scope/safety parsing, manual brand+price+quota facts). No LLM/network calls.
        run: python -m pytest tests/eval -q
