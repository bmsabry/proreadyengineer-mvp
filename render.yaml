services:
  # FastAPI Backend API
  - type: web
    name: proreadyengineer-api
    env: python
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: proreadyengineer-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: BACKEND_CORS_ORIGINS
        value: "https://proreadyengineer-web.onrender.com,http://localhost:3000"
      - key: FRONTEND_URL
        value: "https://proreadyengineer-web.onrender.com"
      # AI/LLM Configuration - Supports OpenAI, DeepInfra, or any OpenAI-compatible API
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_API_BASE
        sync: false  # e.g., https://api.deepinfra.com/v1/openai
      - key: OPENAI_LLM_MODEL
        value: "moonshotai/kimi-k2.5"  # or gpt-4o-mini for OpenAI
      - key: OPENAI_EMBEDDING_MODEL
        value: "text-embedding-3-small"
      # Payment providers
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Email
      - key: RESEND_API_KEY
        sync: false
      # File storage
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET_NAME
        value: "proreadyengineer-uploads"
      # Document signing
      - key: SIGNREQUEST_API_KEY
        sync: false
      # Celery configuration (using database as broker)
      - key: CELERY_BROKER_URL
        fromDatabase:
          name: proreadyengineer-db
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromDatabase:
          name: proreadyengineer-db
          property: connectionString

  # Next.js Frontend
  - type: web
    name: proreadyengineer-web
    env: node
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://proreadyengineer-api.onrender.com
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false

databases:
  - name: proreadyengineer-db
    plan: free
    ipAllowList: []
