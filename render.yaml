services:
  # FastAPI Backend API
  - type: web
    name: proreadyengineer-api
    env: python
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && alembic upgrade head && python ../deploy/scripts/migrate_providers.py && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DATABASE_URL
        fromDatabase:
          name: proreadyengineer-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: "production"
      - key: DEBUG
        value: "false"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: EXTRA_CORS_ORIGINS
        value: "https://proreadyengineer-web.onrender.com,http://localhost:3000"
      - key: FRONTEND_URL
        value: "https://proreadyengineer-web.onrender.com"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_API_BASE
        value: "https://api.deepinfra.com/v1/openai"
      - key: OPENAI_LLM_MODEL
        value: "moonshotai/kimi-k2.5"
      - key: OPENAI_EMBEDDING_MODEL
        value: "BAAI/bge-large-en-v1.5"
      - key: STRIPE_SECRET_KEY
        value: ""
      - key: STRIPE_PUBLISHABLE_KEY
        value: ""
      - key: STRIPE_WEBHOOK_SECRET
        value: ""
      - key: RESEND_API_KEY
        value: ""
      - key: AWS_ACCESS_KEY_ID
        value: ""
      - key: AWS_SECRET_ACCESS_KEY
        value: ""
      - key: S3_BUCKET_NAME
        value: "proreadyengineer-uploads"
      - key: SIGNREQUEST_API_KEY
        value: ""
      - key: CELERY_BROKER_URL
        fromDatabase:
          name: proreadyengineer-db
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromDatabase:
          name: proreadyengineer-db
          property: connectionString

  # Next.js Frontend
  - type: web
    name: proreadyengineer-web
    env: node
    plan: free
    buildCommand: |
      cd frontend
      rm -rf node_modules .next
      npm ci
      npm run build
    startCommand: cd frontend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://proreadyengineer-api.onrender.com
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        value: ""

databases:
  - name: proreadyengineer-db
    plan: free
    ipAllowList: []
